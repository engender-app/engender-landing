<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The referrer policy, in the page rather than only in a response header,
         because lh.pl may or may not send the header static/.htaccess asks for
         and this one arrives either way (ticket 11). Start journal hands the
         Journal no referrer, which is the same promise the link itself makes by
         carrying no campaign parameter and no state. -->
    <meta name="referrer" content="no-referrer" />
    <!-- The two things below are the whole of this document that the content
         policy does not govern, and they sit above SvelteKit's head block
         deliberately. That block opens with the policy, and a policy in a meta
         element governs what is parsed after it and nothing before it - but a
         classic script placed after the stylesheet link waits for the
         stylesheet before it runs, which delays hydration and leaves the theme
         control showing the wrong choice after a reload. Both are written
         here, in a source file, rather than acquired at run time, which is
         what the policy exists to prevent. tests/policy.test.mjs holds the
         line at these two.

         Do not name that placeholder in prose anywhere in this file: the build
         replaces its first occurrence, so a mention in a comment is where the
         whole head lands. (Ticket 11.) -->
    <!-- Both faces are self-hosted; no remote asset, ever. Preloaded because
         between them they set every visible string, so the swap they avoid
         would be the whole page.

         The Latin Extended files are deliberately not preloaded. They exist
         for the Polish diacritics and the unicode-range in base.css already
         fetches them exactly when a page needs them; preloading them would
         download 50kb on the English page to render nothing. -->
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Stamps a stored theme choice before first paint. Someone who chose
         dark chose it for a reason, and repainting from light after hydration
         is a bright flash in their face.

         Only an explicit choice is stamped. With no choice stored there is no
         attribute, and the media query in base.css decides - so a visitor with
         a dark system theme and no scripting gets a dark page too.

         Inline and dependency-free because it has to run before any module is
         parsed, so it cannot import the key or the values. Both are owned by
         src/lib/theme.ts and have to change in the two places together.

         data-js marks that scripting reached this document, so controls that
         only work with it can stay hidden otherwise. */
      try {
        const root = document.documentElement;
        root.dataset.js = 'on';
        const stored = localStorage.getItem('gd-landing-theme');
        if (stored === 'light' || stored === 'dark') root.dataset.theme = stored;
      } catch {
        /* storage unavailable, so the system theme decides */
      }
    </script>
    %sveltekit.head%
    <!-- The app's mark (redesign ticket 08), copied from ../gender-diary/brand/
         rather than imported and served from this origin like everything else.
         Three files because a tab, a bookmark and a phone's home screen each
         ask for a different one, and the SVG is the only one that is the
         drawing rather than a render of it. The mark does not move, anywhere,
         ever: no animation touches it and no theme recolours it.

         Below the head block rather than above it with the preloads, so the
         policy governs them: an icon is fetched by the browser like any other
         image and there is no reason for it to sit in the one region of this
         document nothing has an opinion about. Nothing waits on them either,
         so being parsed a few lines later costs nothing. -->
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/mark-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/mark-192.png" />
  </head>
  <body>
    <!--
      THESIS: this page is the app's own sheet at poster scale, and it refuses
      the arrangement its category always ships - pastel gradient, phone
      mockup at an angle, three icon cards. It also refuses the aurora it
      replaces: no gradients anywhere, ink is flat, surfaces separate with a
      line.
      OWN-WORLD: the app's trans palette for paper, character for character.
      Two deepened flag inks as full-bleed fields, blue for privacy and rose for
      the one warning, the same values in both themes because ink does not
      change with the paper. The eight flags' raw stripes, vivid and never under
      text, for the motif, the section rules, the frames and the swatches.
      Outfit at -0.04em and weight 800 for structure over Nunito for reading,
      one 6px radius on every surface, hairlines at 14% and 19% of the text
      colour, no elevation anywhere, one flat accent on one action.
      STORY: a reader meets the word engender, completes the pun themselves,
      and is then told what the app does and where it keeps their journal.
      FIRST VIEWPORT: the name top left with its dictionary entry directly
      under it as one block, the headword the largest type on the page; the
      claim flush beneath, in text ink, with the action as one solid block of
      the live flag's own accent; the flag sun bleeding off the top-right
      corner, cycling all eight flags on a wave that crosses its rings rim to
      centre and decelerates. The text column
      is capped as a fraction of the sheet so no word can ever be painted on the
      raw stripes.
      FORM: brief-pinned after three re-rolls - the app's own language, taken
      further in motion than the app can afford. Seed key 8ffa734c.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
