<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The referrer policy, in the page rather than only in a response header,
         because lh.pl may or may not send the header static/.htaccess asks for
         and this one arrives either way (ticket 11). Start journal hands the
         Journal no referrer, which is the same promise the link itself makes by
         carrying no campaign parameter and no state. -->
    <meta name="referrer" content="no-referrer" />
    <!-- The two things below are the whole of this document that the content
         policy does not govern, and they sit above SvelteKit's head block
         deliberately. That block opens with the policy, and a policy in a meta
         element governs what is parsed after it and nothing before it - but a
         classic script placed after the stylesheet link waits for the
         stylesheet before it runs, which delays hydration and leaves the theme
         control showing the wrong choice after a reload. Both are written
         here, in a source file, rather than acquired at run time, which is
         what the policy exists to prevent. tests/policy.test.mjs holds the
         line at these two.

         Do not name that placeholder in prose anywhere in this file: the build
         replaces its first occurrence, so a mention in a comment is where the
         whole head lands. (Ticket 11.) -->
    <!-- The one font on the site, self-hosted (ticket 09: no remote asset).
         Preloaded because every visible string is set in it, so the swap it
         avoids would be the whole page. -->
    <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Stamps a stored theme choice before first paint. Someone who chose
         dark chose it for a reason, and repainting from light after hydration
         is a bright flash in their face.

         Only an explicit choice is stamped. With no choice stored there is no
         attribute, and the media query in base.css decides - so a visitor with
         a dark system theme and no scripting gets a dark page too.

         Inline and dependency-free because it has to run before any module is
         parsed, so it cannot import the key or the values. Both are owned by
         src/lib/theme.ts and have to change in the two places together.

         data-js marks that scripting reached this document, so controls that
         only work with it can stay hidden otherwise. */
      try {
        const root = document.documentElement;
        root.dataset.js = 'on';
        const stored = localStorage.getItem('gd-landing-theme');
        if (stored === 'light' || stored === 'dark') root.dataset.theme = stored;
      } catch {
        /* storage unavailable, so the system theme decides */
      }
    </script>
    %sveltekit.head%
  </head>
  <body>
    <!--
      THESIS: this page is the app's own sheet at poster scale, and it refuses
      the arrangement its category always ships - pastel gradient, phone
      mockup at an angle, three icon cards. It also refuses the aurora it
      replaces: no gradients anywhere, ink is flat, surfaces separate with a
      line.
      OWN-WORLD: the app's trans palette for paper, character for character.
      Four deepened flag inks as full-bleed fields, the same in both themes,
      because ink does not change with the paper. The eight flags' raw stripes,
      vivid and never under text, for the motif, the rules and the swatches.
      Outfit at -0.024em over DM Sans, 20px card radius, hairlines at 14/19/30%
      of the text colour, one accent spent on one action.
      STORY: a reader meets the word engender, completes the pun themselves,
      and is then told what the app does and where it keeps their journal.
      FIRST VIEWPORT: running head top left; the dictionary entry as the
      largest thing on screen, headword to 6rem with its sense set beside it;
      the claim indented beneath it in accent ink; the action as one solid
      block; the flag sun bleeding off the top-right corner, cycling all eight
      flags on a wave that crosses its rings rim to centre.
      FORM: brief-pinned after three re-rolls - the app's own language, taken
      further in motion than the app can afford. Seed key 8ffa734c.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
